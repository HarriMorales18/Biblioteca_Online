<header class="header">

	<div class="logo">
		<a routerLink="/">📚 <strong>Biblioteca Online</strong></a>
	</div>

	<button class="menu-toggle" aria-label="Menu" (click)="toggleMenu()">
		<span class="bar"></span>
		<span class="bar"></span>
		<span class="bar"></span>
	</button>

	<nav [class.open]="showMenu">
		<a routerLink="/catalog" routerLinkActive="active" (click)="closeMenuDelayed($event)">Catálogo</a>
		<a routerLink="/my-loans" routerLinkActive="active" (click)="closeMenuDelayed($event)">Mis préstamos</a>
		<a routerLink="/my-reservations" routerLinkActive="active" (click)="closeMenuDelayed($event)">Mis reservas</a>
	</nav>

	<div class="menu-overlay" *ngIf="showMenu" (click)="closeMenu()"></div>

	<div class="search">
		<input
			type="text"
			placeholder="Buscar libro..."
			[(ngModel)]="searchText"
		/>

		<button (click)="search()">Buscar</button>
	</div>

	<div class="auth-area">
		<ng-container *ngIf="!isLogged(); else loggedTpl">
			<a routerLink="/login" class="btn link" (click)="closeMenuDelayed($event)">Login</a>
			<a routerLink="/register" class="btn link" (click)="closeMenuDelayed($event)">Registro</a>
		</ng-container>

		<ng-template #loggedTpl>
			<span class="user">{{ getUser()?.nombre || getUser()?.email }}</span>
			<button class="btn logout" (click)="logout()">Salir</button>
		</ng-template>
	</div>

</header>
