<header class="header">

<div class="header-left">

<div class="logo">
📚
<span>Library System</span>
</div>

<nav *ngIf="authService.user()">

<a routerLink="/catalog">Catálogo</a>

<a routerLink="/my-loans"
*ngIf="authService.user()?.role==='ESTUDIANTE' || authService.user()?.role==='DOCENTE'">
Mis préstamos
</a>

<a routerLink="/my-reservations"
*ngIf="authService.user()?.role==='ESTUDIANTE' || authService.user()?.role==='DOCENTE'">
Mis reservas
</a>

</nav>

</div>


<div class="header-center" *ngIf="authService.user()">

<form (submit)="search()" class="search-box">

<input
type="text"
placeholder="Buscar libro por título o autor..."
[(ngModel)]="searchText"
name="search"
/>

<button type="submit">
🔍
</button>

</form>

</div>


<div class="header-right" *ngIf="authService.user()">

<span class="user">

{{authService.user()?.nombre}}

</span>

<button class="logout" (click)="logout()">
Cerrar sesión
</button>

</div>

  <a
routerLink="/admin-loans"
*ngIf="authService.user()?.role==='ADMIN'"
>
Préstamos
</a>

</header>
