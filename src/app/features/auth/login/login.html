<div class="login">

  <h2>Login</h2>

  <input
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
  >

  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
  >

  <button (click)="login()">
    Iniciar sesión
  </button>

  
  <button class="back" (click)="goHome()">
    Regresar
  </button>

</div>
