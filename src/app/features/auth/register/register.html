<div class="register">

  <h2>Crear cuenta</h2>

  <input
    type="text"
    placeholder="Nombre"
    [(ngModel)]="nombre"
  >

  <input
    type="text"
    placeholder="Apellido"
    [(ngModel)]="apellido"
  >

  <input
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
  >

  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
  >

  <select [(ngModel)]="role" name="role">

    <option value="ESTUDIANTE">
        Estudiante
    </option>

    <option value="DOCENTE">
        Docente
    </option>

    <option value="ADMIN">
        Administrador
    </option>

  </select>

  <button (click)="register()">
    Registrarse
  </button>

  <p class="login-link">
  ¿Ya tienes cuenta?
  <a routerLink="/login">Inicia sesión</a>
  </p>

  <button class="back" (click)="goHome()">
    Regresar
  </button>

</div>
